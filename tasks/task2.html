      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
        <span class="navbar-toggler-icon"></span>

      <div class="collapse navbar-collapse" id="nav">

  <main class="container pb-5">
    <header class="page-top">
      <div class="breadcrumb-text"><a href="../index.html">Home</a> / Part 2 / Task 2</div>
      <span class="eyebrow text-primary">BOOTSTRAP FORMS</span>
      <h1>Bootstrap Styling 🎨</h1>
      <p>A responsive contact form using Bootstrap form controls and grid classes.</p>
    </header>

    <div class="row justify-content-center">
      <div class="col-lg-9">
        <section class="form-shell">
          <form data-demo-form data-success="Message checked! This demo does not send data to a server.">
            <div class="row g-4">
              <div class="col-md-6">
                <label class="form-label" for="name">Name</label>
                <input class="form-control" id="name" name="name" type="text" placeholder="Jordan Lee" required>
              </div>

              <div class="col-md-6">
                <label class="form-label" for="email">Email</label>
                <input class="form-control" id="email" name="email" type="email" placeholder="jordan@example.com" required>
              </div>

              <div class="col-12">
                <label class="form-label" for="topic">What is this about?</label>
                <select class="form-select" id="topic" name="topic" required>
                  <option value="" selected disabled>Choose a topic</option>
                  <option>General question</option>
                  <option>Feedback</option>
                  <option>Collaboration</option>
                </select>
              </div>

              <div class="col-12">
                <label class="form-label" for="message">Message</label>
                <textarea class="form-control" id="message" name="message" required minlength="5" placeholder="Write your message here..."></textarea>
                <div class="form-text">A little detail helps us understand your question.</div>
              </div>

              <div class="col-12">
                <button class="btn btn-primary btn-rounded" type="submit">Send message ↗</button>
              </div>
            </div>

            <div class="form-result" role="status"></div>
          </form>
        </section>
      </div>
    </div>

    <footer class="site-footer">

      <a href="task3.html">Next: Task 3 →</a>
    </footer>
