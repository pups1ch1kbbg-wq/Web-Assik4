<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task 1 | HTML5 Validation</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark site-nav">
    <div class="container">
      <a class="navbar-brand fw-bold" href="../index.html">✦ FormLab</a>
      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <div class="navbar-nav ms-auto">
          <a class="nav-link" href="../index.html">Home</a>
          <a class="nav-link" href="task0.html">Task 0</a>
          <a class="nav-link active" href="task1.html">Task 1</a>
          <a class="nav-link" href="task2.html">Task 2</a>
          <a class="nav-link" href="task3.html">Task 3</a>
          <a class="nav-link" href="task4.html">Task 4</a>
        </div>
      </div>
    </div>
  </nav>

  <main class="container pb-5">
    <header class="page-top">
      <div class="breadcrumb-text"><a href="../index.html">Home</a> / Part 1 / Task 1</div>
      <span class="eyebrow text-primary">HTML5 VALIDATION</span>
      <h1>HTML5 Validation 🛡️</h1>
      <p>Try submitting an empty form or entering an invalid email address.</p>
    </header>

    <div class="row justify-content-center">
      <div class="col-lg-8">
        <section class="form-shell">
          <div class="form-note mb-4">💡 Fields marked with * are required.</div>

          <form data-demo-form data-success="Great! Your form passed HTML5 validation.">
            <div class="mb-4">
              <label class="form-label" for="name">Full name *</label>
              <input class="form-control" id="name" name="name" type="text" required minlength="2" maxlength="50" placeholder="Your name">
            </div>

            <div class="mb-4">
              <label class="form-label" for="email">Email address *</label>
              <input class="form-control" id="email" name="email" type="email" required maxlength="80" placeholder="you@example.com">
            </div>

            <div class="mb-4">
              <label class="form-label" for="message">Message *</label>
              <textarea class="form-control" id="message" name="message" required minlength="10" maxlength="300" placeholder="At least 10 characters"></textarea>
              <div class="form-text">Your message must contain 10–300 characters.</div>
            </div>

            <button class="btn btn-primary btn-rounded" type="submit">Check my form ✓</button>
            <div class="form-result" role="status"></div>
          </form>
        </section>
      </div>
    </div>

    <footer class="site-footer">
      <a href="task0.html">← Previous</a>
      <a href="task2.html">Next: Task 2 →</a>
    </footer>
  </main>

  <script src="../assets/forms.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
